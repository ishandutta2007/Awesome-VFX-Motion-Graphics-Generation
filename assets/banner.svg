<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0c16"/><stop offset="50%" stop-color="#101528"/><stop offset="100%" stop-color="#07090f"/></linearGradient><radialGradient id="glowPulse1" cx="20%" cy="30%" r="60%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".35"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient><radialGradient id="glowPulse2" cx="80%" cy="70%" r="60%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".3"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="35%" stop-color="#e0e7ff"/><stop offset="70%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".7" stdDeviation="6"/></filter><filter id="glow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes waveFlow{0%{stroke-dashoffset:0}}@keyframes scanMove{0%{transform:translateX(80px)}}@keyframes pulse{0%{opacity:.3;transform:scale(.95)}50%{opacity:1;transform:scale(1.15)}}.bg-grid{stroke:rgba(255,255,255,.04);stroke-width:1}.waveform{stroke:url(#accentGrad);stroke-width:2.5;fill:none;opacity:.45;stroke-dasharray:8 4;animation:waveFlow 20s linear infinite}.scanner-line{stroke:#38bdf8;stroke-width:2;opacity:.6;filter:drop-shadow(0 0 8px #38bdf8);animation:scanMove 7s ease-in-out infinite alternate}.data-pill{fill:rgba(30,41,59,.65);stroke:rgba(129,140,248,.3);stroke-width:1;rx:14}.data-pill-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-size:11px;font-weight:600;fill:#94a3b8;letter-spacing:.5px}.pulsing-dot{animation:pulse 2.5s infinite}.pulsing-dot-2{animation:pulse 2.5s infinite 1.25s}.main-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,&apos;SF Pro Display&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:42px;letter-spacing:-.5px;fill:url(#titleGrad);filter:drop-shadow(0 4px 12px rgba(0,0,0,.8))}.badge-label,.tagline{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.tagline{font-weight:500;font-size:17px;letter-spacing:.5px;fill:#cbd5e1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.9))}.badge-label{font-weight:700;font-size:11px;letter-spacing:1.2px;fill:#38bdf8;text-transform:uppercase}</style><rect width="1200" height="360" fill="url(#bgGrad)"/><rect width="1200" height="360" fill="url(#glowPulse1)"/><rect width="1200" height="360" fill="url(#glowPulse2)"/><g class="bg-grid"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="150" x2="150" y1="0" y2="360"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="450" x2="450" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="750" x2="750" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/><line x1="1050" x2="1050" y1="0" y2="360"/></g><path d="M 0,220 Q 150,140 300,210 T 600,180 T 900,230 T 1200,190" class="waveform"/><path class="waveform" style="animation-duration:14s;opacity:.25;stroke-dasharray:4 6" d="M 0,260 Q 200,320 400,240 T 800,270 T 1200,220"/><line x1="0" x2="0" y1="0" y2="360" class="scanner-line"/><g filter="url(#shadow)" transform="translate(60, 42)"><rect width="180" height="28" class="data-pill"/><circle cx="16" cy="14" r="4" fill="#10b981" class="pulsing-dot"/><text x="30" y="18" class="data-pill-text">LATENT EVAL: ACTIVE</text></g><g filter="url(#shadow)" transform="translate(960, 42)"><rect width="180" height="28" class="data-pill"/><circle cx="16" cy="14" r="4" fill="#38bdf8" class="pulsing-dot-2"/><text x="30" y="18" class="data-pill-text">VMAF / SSIM / LPIPS</text></g><g filter="url(#shadow)" opacity=".85" transform="translate(60, 290)"><rect width="230" height="32" class="data-pill"/><text x="18" y="20" class="data-pill-text">⚡ VBench++ • Video-MME • MVBench</text></g><g filter="url(#shadow)" opacity=".85" transform="translate(890, 290)"><rect width="250" height="32" class="data-pill"/><text x="18" y="20" class="data-pill-text">📊 GenVideo Realism &amp; Temporal QA</text></g><g filter="url(#shadow)" transform="translate(450, 68)"><rect width="300" height="32" fill="rgba(30, 41, 59, 0.9)" stroke="url(#accentGrad)" stroke-width="1.5" rx="16"/><circle cx="22" cy="16" r="4" fill="#38bdf8"/><text x="36" y="20" class="badge-label">CURATED BENCHMARK SUITE</text></g><g text-anchor="middle"><text x="600" y="152" class="main-title">Awesome Video AI Benchmarking</text><text x="600" y="196" class="tagline">Comprehensive Evaluation Harnesses, Video-LLMs, Generative Quality &amp; Perceptual Metrics</text><text x="600" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1">SaaS PLATFORMS • OPEN-SOURCE METRIC HARNESSES • LEADERBOARDS • RESEARCH APIS</text></g></svg>